name: Verify
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - run: go test -race ./...
      - run: go vet ./...

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5
      - name: Build, lint and test
        run: ./gradlew :email-verification:testDebugUnitTest :email-verification:lintDebug :app:lintDebug :app:assembleDebug
      - name: Render screenshot candidates
        shell: bash
        run: python3 scripts/screenshots/review.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Validate approved baselines
        if: ${{ hashFiles('docs/screenshots/baselines.json') != '' }}
        run: ./gradlew :email-verification:validateDebugScreenshotTest :app:validateDebugScreenshotTest
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshot-review
          path: |
            build/screenshot-review/
            app/build/reports/screenshotTest/
            email-verification/build/reports/screenshotTest/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        with:
          name: demo-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: sh ./docs.sh check
      - run: sh ./docs.sh build --check
      - run: sh ./docs.sh build --check --base /
