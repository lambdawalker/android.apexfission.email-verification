[versions]
agp = "9.4.1"
kotlin = "2.4.20"
composeBom = "2026.06.00"
activity = "1.12.2"
lifecycle = "2.10.0"
screenshot = "0.0.1-alpha16"

[plugins]
application = { id = "com.android.application", version.ref = "agp" }
library = { id = "com.android.library", version.ref = "agp" }
compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
screenshot = { id = "com.android.compose.screenshot", version.ref = "screenshot" }

[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-tooling = { module = "androidx.compose.ui:ui-tooling" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version = "1.10.2" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version = "1.10.2" }
ui-common = { module = "com.github.lambdawalker:android.ui.common", version = "ui-common~v0.1.1-jitpack" }
screenshot-api = { module = "com.android.tools.screenshot:screenshot-validation-api", version.ref = "screenshot" }
junit = { module = "junit:junit", version = "4.13.2" }
compose-test = { module = "androidx.compose.ui:ui-test-junit4" }
test-junit = { module = "androidx.test.ext:junit", version = "1.3.0" }
test-runner = { module = "androidx.test:runner", version = "1.7.0" }
espresso-intents = { module = "androidx.test.espresso:espresso-intents", version = "3.7.0" }
uiautomator = { module = "androidx.test.uiautomator:uiautomator", version = "2.3.0" }
